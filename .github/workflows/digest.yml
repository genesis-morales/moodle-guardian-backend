name: digest

on:
  schedule:
    # 13 16 UTC lunes = lunes 10:00 America/Costa_Rica (UTC-6, sin horario de verano).
    - cron: "13 16 * * 1"
  workflow_dispatch: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.workers.run_job digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
