name: scan

on:
  schedule:
    # Cada 3h. Minuto 17 para esquivar el "herd" de las :00 en runners de GH.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.workers.run_job scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
