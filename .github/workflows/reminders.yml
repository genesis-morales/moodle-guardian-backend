name: reminders

on:
  # Schedule desactivado: el disparo programado ahora lo hace un cron externo
  # (cron-job.org) contra POST /v1/cron/reminders, porque los scheduled workflows
  # de GitHub Actions omitían/retrasaban ejecuciones. Se conserva workflow_dispatch
  # para poder dispararlo a mano como respaldo.
  # schedule:
  #   # 23 21 UTC = 15:00 America/Costa_Rica (UTC-6, sin horario de verano).
  #   - cron: "23 21 * * *"
  workflow_dispatch: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  run:
    environment: SCHEDULER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.workers.run_job reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
